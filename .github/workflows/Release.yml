name: Release

# 版本号由人工修改（packages/calendar/package.json 的 version）。
# 触发：package.json 有改动，或手动 Run workflow。
# 真正发布前用 `vp view` 对比 npm 上的版本，版本没变就跳过。
on:
  push:
    branches:
      - master
    paths:
      - "packages/calendar/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-calendar
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 装 vp / Node / bun 并执行 vp install；registry-url 会在 $RUNNER_TEMP 写 .npmrc
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          registry-url: https://registry.npmjs.org
          scope: "@sanguogege"

      - name: Detect version change
        id: version
        run: |
          set -euo pipefail
          current=$(node -p "require('./packages/calendar/package.json').version")
          published=$(vp view @sanguogege/calendar version 2>/dev/null | tail -n 1 || true)

          echo "package.json: $current"
          echo "npm:          ${published:-<未发布>}"

          {
            echo "version=$current"
            if [ "$published" = "$current" ]; then
              echo "changed=false"
            else
              echo "changed=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Skip publish (version unchanged)
        if: steps.version.outputs.changed != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "::notice::版本 ${VERSION} 已发布到 npm，跳过。"

      # 等价于 vp check && vp run -r test && vp run -r build
      - name: Check, test and build
        if: steps.version.outputs.changed == 'true'
        run: vp run ready

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: packages/calendar
        run: vp pm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="@sanguogege/calendar@${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" > /dev/null; then
            echo "tag ${tag} 已存在，跳过创建"
          else
            git tag "${tag}"
            git push origin "${tag}"
            gh release create "${tag}" --title "${tag}" --generate-notes
          fi
